name: reusable-terraform

# Reusable workflow: fmt, validate, plan, and (optionally) apply one Terraform root.
# Authenticates to GCP with Workload Identity Federation, so no service account keys exist.
#
# If the GitHub environment has no GCP variables yet (bootstrap.sh not run), the job
# runs in "validate-only" mode: fmt + init without backend + validate, no cloud calls.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root to run in, e.g. envs/dev
        type: string
        required: true
      environment:
        description: GitHub environment (holds vars and the approval gate)
        type: string
        required: true
      apply:
        description: Apply the saved plan after it is created
        type: boolean
        default: false
      terraform-version:
        type: string
        default: "1.9.8"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      CLOUD_CONFIGURED: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_TERRAFORM_SA != '' && vars.TF_STATE_BUCKET != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Mode
        run: |
          if [ "$CLOUD_CONFIGURED" = "true" ]; then
            echo "Cloud mode: plan against GCP"
          else
            echo "::notice title=Validate-only mode::GCP variables are not set on the '${{ inputs.environment }}' environment. Run scripts/bootstrap.sh and add its output as environment variables to enable plan/apply."
          fi

      - name: Authenticate to Google Cloud
        if: env.CLOUD_CONFIGURED == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (with remote state)
        if: env.CLOUD_CONFIGURED == 'true'
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Init (no backend)
        if: env.CLOUD_CONFIGURED != 'true'
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        if: env.CLOUD_CONFIGURED == 'true'
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode -no-color > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Comment plan on pull request
        if: env.CLOUD_CONFIGURED == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          WORKDIR: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.WORKDIR}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan: \`${process.env.WORKDIR}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      - name: Apply
        if: env.CLOUD_CONFIGURED == 'true' && inputs.apply && steps.plan.outputs.exitcode == '2'
        run: terraform apply -auto-approve tfplan

name: reusable-iac-scan

# Reusable workflow: lint Terraform with TFLint and scan it for misconfigurations with Checkov.

on:
  workflow_call:
    inputs:
      directory:
        description: Directory to scan
        type: string
        default: "."

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        working-directory: ${{ inputs.directory }}
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ inputs.directory }}
          framework: terraform
          quiet: true
          soft_fail: false
